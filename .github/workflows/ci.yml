name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Sets NX_BASE / NX_HEAD so `nx affected` compares against the right commit.
      - uses: nrwl/nx-set-shas@v4

      - run: pnpm exec prettier --check .

      - name: Affected targets (pull requests)
        if: github.event_name == 'pull_request'
        run: pnpm exec nx affected -t lint typecheck test build

      - name: All targets (main)
        if: github.event_name == 'push'
        run: pnpm exec nx run-many -t lint typecheck test build

  database:
    name: Database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ninno
          POSTGRES_PASSWORD: ninno
          # Admin database; each test run creates and drops its own ninno_test_<ts>_<pid>.
          POSTGRES_DB: ninno_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ninno -d ninno_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgresql://ninno:ninno@localhost:5432/ninno_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run api:test-db

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Reported but not blocking until the dependency tree settles.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm audit --prod --audit-level high
